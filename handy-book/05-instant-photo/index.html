<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#242422" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Handy" />
  <title>Handy Book</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root { --studio:#d8d2c6; --frame:#f7f4ee; --ink:#242422; --mute:#7a756c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--studio); color: var(--ink); }
    body {
      font: 16px/1.35 "DM Sans", system-ui, sans-serif;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 0%, #efe8dc, var(--studio) 60%);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .stage { max-width: 420px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 18px 48px; }
    .word { font-family: "Instrument Serif", serif; font-size: 15px; color: var(--mute); }
    h1 { font-family: "Instrument Serif", serif; font-size: 40px; font-weight: 400; margin: 6px 0 22px; }
    .hidden { display: none !important; }
    .polaroid {
      background: var(--frame);
      padding: 12px 12px 52px;
      box-shadow: 0 18px 40px rgba(30,24,16,.18);
      margin: 0 auto 18px;
      width: min(100%, 320px);
    }
    .polaroid .well {
      background: #1a1a18; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; position: relative;
    }
    .polaroid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .polaroid .cap {
      position: absolute; left: 12px; right: 12px; bottom: 14px;
      font-family: "Instrument Serif", serif; font-size: 20px;
    }
    .develop img { filter: contrast(.2) brightness(1.6); animation: dev 1.4s forwards; }
    @keyframes dev { to { filter: none; } }
    .lens {
      width: 88px; height: 88px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5a5a56, #111);
      box-shadow: 0 0 0 10px #2a2a28, 0 8px 20px rgba(0,0,0,.3);
    }
    .row { display: flex; gap: 8px; justify-content: center; }
    .pill {
      background: var(--ink); color: var(--frame); padding: 12px 16px; border-radius: 999px; font-weight: 700;
    }
    .quiet { color: var(--mute); padding: 12px 16px; }
    .stack { display: grid; gap: 14px; }
    .mini {
      display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center;
      background: var(--frame); padding: 8px 10px 14px; box-shadow: 0 10px 24px rgba(30,24,16,.12);
    }
    .mini .sq { background: #ddd8ce; aspect-ratio: 1; }
    .mini b { display: block; font-family: "Instrument Serif", serif; font-size: 20px; font-weight: 400; }
    .mini i { font-style: normal; font-weight: 700; }
    .sheet {
      background: var(--frame); padding: 18px 16px 22px; min-height: 340px;
      box-shadow: 0 18px 40px rgba(30,24,16,.16);
    }
    .sheet .p { float: right; font-family: "Instrument Serif", serif; font-size: 28px; }
    .type {
      width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: transparent;
      padding: 10px 0; margin: 8px 0 14px;
    }
    .hits { margin: 0; padding: 0; }
    .hits button { display: block; width: 100%; text-align: left; padding: 8px 0; font-family: "Instrument Serif", serif; font-size: 22px; }
    .jobs button { display: block; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid #e4dfd4; }
    .back { color: var(--mute); margin-bottom: 12px; }
    .install { position: fixed; left: 12px; right: 12px; bottom: 12px; background: var(--ink); color: var(--frame); padding: 12px; font-weight: 700; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="word">Handy Book</div>

    <section id="home">
      <h1>Show the bike.</h1>
      <label class="polaroid">
        <input id="photo" type="file" accept="image/*" capture="environment" hidden />
        <div class="well"><div class="lens"></div></div>
        <div class="cap">Snap</div>
      </label>
      <div class="row">
        <button class="quiet" id="typeBtn" type="button">Or write the name</button>
      </div>
      <form id="typeForm" class="hidden">
        <input class="type" id="q" type="search" placeholder="Yamaha XT250" />
        <ul class="hits" id="hits"></ul>
      </form>
    </section>

    <section id="found" class="hidden">
      <button class="back" id="backHome" type="button">←</button>
      <div class="polaroid develop" id="idCard">
        <div class="well"><img id="shot" alt="" /></div>
        <div class="cap" id="bikeName"></div>
      </div>
      <p class="word" id="bikeMeta"></p>
      <div class="jobs" id="jobs"></div>
    </section>

    <section id="book" class="hidden">
      <button class="back" id="backFound" type="button">←</button>
      <div class="polaroid">
        <div class="well" style="background:#efe8dc;place-items:center">
          <div style="font-family:Instrument Serif,serif;font-size:64px" id="pageBig"></div>
        </div>
        <div class="cap" id="jobName"></div>
      </div>
      <p class="word" id="figRef"></p>
      <div class="row"><button class="pill" id="openPage" type="button">Open page</button></div>
    </section>

    <section id="page" class="hidden">
      <button class="back" id="backBook" type="button">←</button>
      <article class="sheet">
        <span class="p" id="manPage"></span>
        <div class="word" id="manTitle"></div>
        <h1 id="manChapter"></h1>
        <svg viewBox="0 0 240 90" width="100%" aria-hidden="true">
          <rect x="20" y="20" width="80" height="50" fill="none" stroke="#242422" stroke-width="2"/>
          <path d="M100 45h70" stroke="#242422" stroke-width="2"/>
          <circle cx="190" cy="45" r="16" fill="none" stroke="#242422" stroke-width="2"/>
        </svg>
        <p id="manFig"></p>
      </article>
      <div class="row" style="margin-top:16px"><button class="pill" id="toParts" type="button">Parts</button></div>
    </section>

    <section id="parts" class="hidden">
      <button class="back" id="backPage" type="button">←</button>
      <h1>Parts</h1>
      <div class="stack" id="partStack"></div>
      <p style="display:flex;justify-content:space-between;margin:18px 4px 0"><span class="word">Total</span><b id="partTotal"></b></p>
      <div class="row" style="margin-top:16px"><button class="pill" id="buy" type="button">Get</button></div>
    </section>

    <section id="done" class="hidden">
      <h1>Sent.</h1>
      <p class="word" id="doneNote"></p>
      <div class="row"><button class="pill" id="again" type="button">New photo</button></div>
    </section>
  </div>
  <button class="install hidden" id="install" type="button">Add to home screen</button>
  <script src="../shared/catalog.js"></script>
  <script>
    const S = {};
    const $ = (id) => document.getElementById(id);
    const show = (id) => {
      document.querySelectorAll(".stage > section").forEach((el) => el.classList.add("hidden"));
      $(id).classList.remove("hidden");
    };
    Handy.registerPWA("./sw.js");

    $("typeBtn").onclick = () => $("typeForm").classList.toggle("hidden");
    $("q").addEventListener("input", () => {
      const hits = Handy.search($("q").value);
      $("hits").innerHTML = hits.map((b) =>
        `<li><button type="button" data-id="${b.id}">${b.name}</button></li>`
      ).join("");
    });
    $("hits").onclick = (e) => {
      const btn = e.target.closest("button[data-id]");
      if (btn) openBike(Handy.bike(btn.dataset.id), false);
    };
    $("photo").onchange = () => {
      const file = $("photo").files[0];
      if (file) $("shot").src = URL.createObjectURL(file);
      else $("shot").removeAttribute("src");
      openBike(Handy.fromPhoto(), true);
    };

    function openBike(bike, fromPhoto) {
      S.bike = bike;
      $("bikeName").textContent = bike.name;
      $("bikeMeta").textContent = bike.years;
      if (!fromPhoto) {
        $("shot").removeAttribute("src");
        $("shot").parentElement.style.background = "#2a2a28";
      }
      $("jobs").innerHTML = bike.jobs.map((j) =>
        `<button type="button" data-job="${j.id}">${j.name}</button>`
      ).join("");
      const card = $("idCard");
      card.classList.remove("develop");
      void card.offsetWidth;
      card.classList.add("develop");
      show("found");
    }

    $("jobs").onclick = (e) => {
      const btn = e.target.closest("button[data-job]");
      if (!btn) return;
      S.job = Handy.job(S.bike, btn.dataset.job);
      $("pageBig").textContent = S.job.page;
      $("jobName").textContent = S.job.name;
      $("figRef").textContent = "Fig. " + S.job.figure;
      show("book");
    };

    $("openPage").onclick = () => {
      $("manTitle").textContent = S.bike.manual.title;
      $("manPage").textContent = S.job.page;
      $("manChapter").textContent = S.job.chapter;
      $("manFig").textContent = "Figure " + S.job.figure;
      show("page");
    };

    $("toParts").onclick = () => {
      const t = Handy.totals(S.job.parts);
      $("partStack").innerHTML = S.job.parts.map((p) =>
        `<div class="mini"><div class="sq"></div><div><b>${p.name}</b>${p.store} · ${Handy.shipLabel(p)}</div><i>${Handy.money(p.price)}</i></div>`
      ).join("");
      $("partTotal").textContent = Handy.money(t.all);
      show("parts");
    };

    $("buy").onclick = () => {
      $("doneNote").textContent = S.job.parts.map((p) => p.store).filter((v, i, a) => a.indexOf(v) === i).join(" · ");
      show("done");
    };
    $("backHome").onclick = () => show("home");
    $("backFound").onclick = () => show("found");
    $("backBook").onclick = () => show("book");
    $("backPage").onclick = () => show("page");
    $("again").onclick = () => { $("shot").removeAttribute("src"); $("hits").innerHTML = ""; show("home"); };

    let deferred;
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("install").classList.remove("hidden"); });
    $("install").onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; $("install").classList.add("hidden"); } };
  </script>
</body>
</html>
