# Re-fetches the primary sources (company pages, SEC filings, news), re-checks every quote
# word for word, re-scores, and rebuilds prototypes/03-compute-works/live.js.
# Commits only when something changed, so the git history doubles as a record of
# when a company's wording appeared, changed or disappeared.
name: Refresh records
on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch and process sources
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # "Name email", required by the SEC for automated requests
        run: |
          python pipeline/live/refresh.py
          python pipeline/claims/verify.py
          python pipeline/claims/score.py
          python pipeline/texas/build.py
          python pipeline/site/build.py
          python pipeline/bundle.py
      - name: Commit if anything changed
        run: |
          git config user.name "records-bot"
          git config user.email "records-bot@users.noreply.github.com"
          git add pipeline prototypes/03-compute-works/live.js
          git diff --cached --quiet || git commit -m "Refresh public records and company claims"
          git push
