<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yard — talk to the plant</title>
    <style>
      :root {
        --bg: #10140f;
        --panel: #1a2118;
        --ink: #e7eedc;
        --mute: #9aa68a;
        --line: #2c3828;
        --accent: #c9a24a;
        --ok: #8fba5a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr auto; }
      header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 16px; border-bottom: 1px solid var(--line);
      }
      header h1 { margin: 0; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
      header p { margin: 0; color: var(--mute); font-size: 13px; }
      #view { position: relative; min-height: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute; left: 12px; top: 12px; max-width: 28rem;
        background: #0007; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: var(--mute);
      }
      footer {
        display: grid; grid-template-columns: 1fr auto; gap: 8px;
        padding: 10px 12px 14px; border-top: 1px solid var(--line); background: var(--panel);
      }
      #row { display: flex; gap: 8px; }
      #prompt {
        flex: 1; background: #0d110c; color: var(--ink); border: 1px solid var(--line);
        border-radius: 8px; padding: 10px 12px; font: inherit;
      }
      button {
        background: var(--accent); color: #1c140c; border: 0; border-radius: 8px;
        padding: 10px 14px; font: 600 13px/1 inherit; cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      #chips button { padding: 6px 9px; font-weight: 500; font-size: 12px; }
      #note { grid-column: 1 / -1; color: var(--ok); font-size: 13px; min-height: 1.2em; }
      #note.err { color: #e08a6a; }
    </style>
  </head>
  <body>
    <header>
      <h1>Yard</h1>
      <p>Change the data center in English. Download a GLTF.</p>
    </header>
    <div id="view">
      <div id="hud">QTS Fort Worth FTW1 · drag to orbit</div>
    </div>
    <footer>
      <div>
        <div id="row">
          <input id="prompt" autofocus placeholder='make DC1 taller · add a hall · more generators · move the pond west 40m' />
          <button id="go" type="button">Apply</button>
          <button id="gltf" class="ghost" type="button">Download GLTF</button>
          <button id="reset" class="ghost" type="button">Reset</button>
        </div>
        <div id="chips">
          <button class="ghost" data-q="make DC1 8m taller" type="button">taller hall</button>
          <button class="ghost" data-q="add a data hall" type="button">add hall</button>
          <button class="ghost" data-q="more generators" type="button">more gens</button>
          <button class="ghost" data-q="move the pond west 40m" type="button">pond west</button>
          <button class="ghost" data-q="hide the fence" type="button">no fence</button>
          <button class="ghost" data-q="paint DC1 red" type="button">paint red</button>
        </div>
      </div>
      <div id="note">Loaded Fort Worth massing. Type a change.</div>
    </footer>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      import { applyPrompt, cloneCampus, DEFAULT_CAMPUS } from "./campus.mjs";

      const view = document.getElementById("view");
      const hud = document.getElementById("hud");
      const noteEl = document.getElementById("note");
      const input = document.getElementById("prompt");

      let campus = cloneCampus();
      let plant = new THREE.Group();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87a0b4);
      scene.fog = new THREE.FogExp2(0x87a0b4, 0.0018);

      const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 2000);
      camera.position.set(160, 110, 170);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      view.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(8, 8, -20);
      controls.maxPolarAngle = Math.PI * 0.49;

      scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a4030, 0.95));
      const sun = new THREE.DirectionalLight(0xfff1d0, 1.55);
      sun.position.set(-90, 140, 70);
      scene.add(sun);

      function hexMat(hex, extra = {}) {
        return new THREE.MeshStandardMaterial({
          color: hex,
          roughness: extra.roughness ?? 0.7,
          metalness: extra.metalness ?? 0.05,
          transparent: extra.opacity != null,
          opacity: extra.opacity ?? 1,
        });
      }

      function box(w, h, d, x, y, z, mat) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z);
        m.castShadow = false;
        plant.add(m);
        return m;
      }

      function cyl(r, h, x, y, z, mat, seg = 16) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
        m.position.set(x, y, z);
        plant.add(m);
        return m;
      }

      function rebuild() {
        scene.remove(plant);
        plant = new THREE.Group();
        plant.name = campus.name.replace(/\s+/g, "_");

        const grass = hexMat(0x5a6b3c);
        box(campus.lot.w + 40, 0.3, campus.lot.d + 40, 0, -0.15, 0, grass);

        const wall = hexMat(campus.halls[0]?.color || "#c4b89a");
        for (const h of campus.halls) {
          const mat = hexMat(h.color);
          box(h.w, h.h, h.d, h.x, h.h / 2, h.z, mat);
          box(h.w + 1, 0.45, h.d + 1, h.x, h.h + 0.2, h.z, hexMat(0xe4e0d8));
          if (campus.hvac) {
            for (let i = 0; i < 8; i++) {
              for (let j = 0; j < 3; j++) {
                box(
                  5.2,
                  1.8,
                  4,
                  h.x - h.w / 2 + 12 + i * ((h.w - 20) / 7),
                  h.h + 1.3,
                  h.z - h.d / 2 + 10 + j * 12,
                  hexMat(0xcfd3d6, { metalness: 0.25, roughness: 0.4 })
                );
              }
            }
          }
        }

        if (campus.office.enabled) {
          const o = campus.office;
          box(o.w, o.h, o.d, o.x, o.h / 2, o.z, hexMat(o.color, { metalness: 0.2 }));
          box(0.25, o.h * 0.85, o.d * 0.8, o.x - o.w / 2 - 0.2, o.h / 2, o.z, hexMat(0x4a6b7a, { opacity: 0.45, metalness: 0.5, roughness: 0.12 }));
        }

        if (campus.generators.enabled) {
          const g = campus.generators;
          const genset = hexMat(0xc4b094);
          const stack = hexMat(0x888990, { metalness: 0.7, roughness: 0.3 });
          for (let r = 0; r < g.rows; r++) {
            for (let col = 0; col < g.cols; col++) {
              const x = g.x - 40 + col * 8.2;
              const z = g.z - r * 10;
              box(5.6, 3, 2.4, x, 1.7, z, genset);
              cyl(0.28, 4.2, x + 2, 5.2, z, stack, 8);
            }
          }
        }

        if (campus.substation.enabled) {
          const s = campus.substation;
          box(s.w, 0.5, s.d, s.x, 0.25, s.z, hexMat(0x9a9a92));
          box(s.w * 0.55, s.h, s.d * 0.4, s.x, s.h / 2, s.z, hexMat(0x6a6e72, { metalness: 0.6 }));
          box(s.w * 0.7, 0.35, 0.35, s.x, 14, s.z, hexMat(0x55565a, { metalness: 0.7 }));
        }

        if (campus.pond.enabled) {
          cyl(campus.pond.r, 0.5, campus.pond.x, -0.1, campus.pond.z, hexMat(0x3a6570, { roughness: 0.2, metalness: 0.1 }), 24);
        }

        if (campus.parking.enabled) {
          const p = campus.parking;
          box(p.w, 0.12, p.d, p.x, 0.06, p.z, hexMat(0x2e2e30));
        }

        if (campus.fence) {
          const f = hexMat(0x141416, { metalness: 0.4 });
          const W = campus.lot.w, D = campus.lot.d;
          box(W, 3, 0.12, 0, 1.5, D / 2, f);
          box(W, 3, 0.12, 0, 1.5, -D / 2, f);
          box(0.12, 3, D, -W / 2, 1.5, 0, f);
          box(0.12, 3, D, W / 2, 1.5, 0, f);
        }

        scene.add(plant);
        hud.textContent = `${campus.name} · ${campus.halls.length} hall${campus.halls.length === 1 ? "" : "s"} · drag to orbit`;
      }

      function say(msg, ok = true) {
        noteEl.textContent = msg;
        noteEl.className = ok ? "" : "err";
      }

      function run(q) {
        const { campus: next, note, ok } = applyPrompt(campus, q);
        campus = next;
        rebuild();
        say(note, ok);
      }

      document.getElementById("go").onclick = () => {
        run(input.value);
        input.value = "";
        input.focus();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          run(input.value);
          input.value = "";
        }
      });
      document.getElementById("reset").onclick = () => run("reset");
      document.querySelectorAll("#chips [data-q]").forEach((b) => {
        b.onclick = () => run(b.dataset.q);
      });

      document.getElementById("gltf").onclick = () => {
        new GLTFExporter().parse(
          plant,
          (res) => {
            const blob = new Blob([res], { type: "model/gltf-binary" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${campus.name.replace(/\s+/g, "-").toLowerCase()}.glb`;
            a.click();
            say(`Downloaded ${a.download}`);
          },
          (err) => say(String(err), false),
          { binary: true }
        );
      };

      function resize() {
        const w = view.clientWidth, h = view.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      addEventListener("resize", resize);
      resize();
      rebuild();

      (function tick() {
        requestAnimationFrame(tick);
        controls.update();
        renderer.render(scene, camera);
      })();
    </script>
  </body>
</html>
